[project]
name = "litellm-pass-through-proxy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "backoff>=2.2.1",
    "google-cloud-aiplatform>=1.129.0",
    "httpx>=0.28.1",
    "litellm[proxy]>=1.80.7",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "prisma>=0.15.0",
]

[project.scripts]
run-proxy = "litellm_pass_through_proxy.run_proxy:main"

[tool.poetry]
packages = [
    { include = "litellm_pass_through_proxy" },
]
